<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction de Script HTML - 🚀 Version Finale</title>

    <!-- CSS Intégré -->
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #2980b9;
            --text-dark: #333;
            --background-light: #ecf0f1;
        }

        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--background-light);
            transition: all 0.5s ease;
        }

        /* ============================================== */
        /* LOADER / ANIMATION */
        /* ============================================== */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .loader-overlay.active {
            opacity: 1;
            pointer-events: none;
        }

        /* ============================================== */
        /* CONTAINER DE CONTENT */
        .showcase-container {
            padding: 40px;
            margin-top: 40px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        /* ============================================== */
        /* HEADER : Accueil dynamique */
        /* ============================================== */
        section {
            background-color: white;
            padding: 40px;
            margin-bottom: 30px;
        }

        /* ============================================== */
        /* FEATURES DÉMOZINANT */
        /* ============================================== */
        .feature-list {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
        }

        .feature-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin: 5px;
            transition: transform 0.3s ease;
        }

        .feature-item:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        /* ============================================== */
        /* ANIMATION DE SURREAL (SURS ENTRE LA BUTTE) */
        /* ============================================== */
        .showcase-item {
            background: var(--secondary-color);
            color: white;
            padding: 30px;
            border-radius: 10px;
            transition: transform 0.6s ease, box-shadow 0.6s ease;
            cursor: pointer;
        }

        .showcase-item:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* ============================================== */
        /* MODALE DE DÉCLARATION */
        /* ============================================== */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            transition: opacity 0.5s ease;
        }

        #modal-box {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }

        #modal-title {
            font-size: 2em;
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 10px;
        }

        /* ============================================== */
        /* CONTENUME PRINCIPAL */
        /* ============================================== */
        <section id="loader-content">
            <h1 style="color: var(--primary-color);">🚀 Construction du Site Web</h1>
            <p>Nous construisons votre site web étape par étape. Tout est transparent et interactif !</p>

            <!-- ANIMATION DE LA BUTTE -->
            <div class="loader-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>

            <!-- CONTENU DÉMOZINANT -->
            <div class="showcase-container">
                <h2>🎯 Vos Besoins</h2>
                <div class="feature-list">
                    <div class="feature-item" onclick="displayModal('shop')">🛍️ Boutique de Chaussures</div>
                    <div class="feature-item" onclick="displayModal('portfolio')">🖼️ Galerie d'Artiste</div>
                    <div class="feature-item" onclick="displayModal('local')">☕ Café / Restaurant</div>
                </div>

                <!-- MODALE DE DÉCLARATION -->
                <div id="modal" class="modal">
                    <div class="modal-content">
                        <h3>🎉 Votre Projet</h3>
                        <p>Nous vous aidons à créer un site web parfait, sans frais. Découvrez comment !</p>
                        <button id="closeBtn">Fermer</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- SHOWCASE DES RÉALISATIONS -->
        <section id="showcases">
            <h2>🖼️ Vos Projets</h2>
            <p style="text-align: center; font-size: 1.3em;">Découvrez nos réalisations.</p>

            <div class="showcase-item" onclick="displayModal('shop')">
                <h4>🛍️ Boutique de Chaussures</h4>
                <p>Un magasin en ligne avec produits variés et un design moderne.</p>
            </div>
            <div class="showcase-item" onclick="displayModal('portfolio')">
                <h4>🖼️ Galerie Artistique</h4>
                <p>Une collection d'œuvres d'artistes locaux et internationaux.</p>
            </div>
            <div class="showcase-item" onclick="displayModal('local')">
                <h4>☕ Café / Restaurant</h4>
                <p>Un espace convivial avec une carte et des horaires précis.</p>
            </div>
        </section>
    </style>

    <!-- JS (Animation + Modale) -->
    <script>
        // ============================================== */
        // ============================================== */
        // FONCTIONS DE L'ANIMATION ET DE LA MODALE
        // ==============================================

        const modalOverlay = document.getElementById('modal-overlay');
        const modalContent = document.getElementById('modal-content');
        const closeBtn = document.querySelector('.close-btn');

        // 🎬 Animation de la brique (effet de survol)
        function animateBrick() {
            const items = document.querySelectorAll('.showcase-item');
            items.forEach(item => {
                item.style.transform = `scale(${item.style.transform});`);
                setTimeout(() => {
                    item.style.transform = 'scale(1)';
                }, 100);
            });
        }

        // 🔄 Animation de la progression
        function animateProgress() {
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = `${(Math.random() * 100) % 100}%`;
            setTimeout(() => progressBar.style.width = '100%', 500);
        }

        // 🚪 Fermeture de la modale
        function closeModal() {
            modalContent.style.display = 'none';
            modalOverlay.classList.remove('active');
        }

        // 🎨 Fonction de démonstration
        function displayModal(type) {
            const modal = modalOverlay;
            const titleElement = document.getElementById('modal-title');
            const contentElement = modalContent;

            // Remplir le contenu selon le type
            switch(type) {
                case 'shop':
                    contentElement.innerHTML = `
                        <h4>${titleElement.textContent}</h4>
                        <p>Un magasin en ligne avec produits variés.</p>
                        <button style="background: var(--secondary-color); color: white; padding: 10px;">Ajouter au panier</button>
                    `;
                    break;
                case 'portfolio':
                    contentElement.innerHTML = `
                        <h4>${titleElement.textContent}</h4>
                        <p>Une galerie d'artistes avec des œuvres uniques.</p>
                        <button style="background: var(--primary-color); color: white; padding: 10px;">Voir le portfolio</button>
                    `;
                    break;
                case 'local':
                    contentElement.innerHTML = `
                        <h4>${titleElement.textContent}</h4>
                        <p>Un café ou restaurant local avec une ambiance chaleureuse.</p>
                        <button style="background: var(--secondary-color); color: white; padding: 10px;">Réserver une table</button>
                    `;
                    break;
            }
        }

        // 🕹️ Événements interactifs
        document.addEventListener('click', (e) => {
            if (e.target.tagName === 'BUTTON') closeModal();
        });

        // 🔄 Boucle de chargement
        animateProgress(); // Effet initial
        setTimeout(() => {
            animateBrick(); // Effet final
        }, 2000);
    </script>
</body>
</html>
