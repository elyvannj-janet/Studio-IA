<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio IA v9.6 - Stable Diffusion XL</title>
    
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-light);
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%;
            max-width: 460px; 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 30px; }
        #target { display: none; }
        
        .canvas-display { 
            margin: 0 auto 25px auto; 
            position: relative;
            display: block;
            width: 100%;
            max-width: 380px;
        }

        canvas#robot { 
            border-radius: 16px; 
            background: #f1f5f9; 
            border: 1px solid var(--border-color);
            width: 100%; 
            height: auto;
            display: block;
        }

        #barContainer { width: 100%; background: #f1f5f9; height: 5px; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.2s ease-out; }

        .controls { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            background: #f8fafc;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        input#cmd { 
            flex: 1; 
            padding: 10px 12px; 
            border-radius: 10px; 
            border: none; 
            background: transparent; 
            color: var(--text-main); 
            outline: none;
            font-size: 0.95rem;
        }

        button { 
            padding: 10px 22px; 
            background: var(--text-main); 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        button:hover { background: #1e293b; }
        .hidden-file { display: none; }
        #status { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; min-height: 1.2em; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h1>Studio IA Cloud</h1>
    <div class="subtitle">Génération SDXL &amp; Tracé en temps réel</div>
    
    <div id="status">Prêt pour votre prompt...</div>
    <div id="barContainer"><div id="bar"></div></div>

    <div class="canvas-display">
        <canvas id="robot" width="400" height="400"></canvas>
        <canvas id="target" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <input type="file" id="fileInput" class="hidden-file" accept="image/*">
        <button style="background:none; color:var(--text-main); border:1px solid var(--border-color);" onclick="document.getElementById('fileInput').click()">📁</button>
        <input id="cmd" placeholder="Ex: futuristic city, neon lights, 8k...">
        <button id="send">Générer</button>
    </div>
</div>

<script>
const SIZE = 400;
const targetCanvas = document.getElementById("target");
const robotCanvas = document.getElementById("robot");
const tctx = targetCanvas.getContext("2d", { willReadFrequently: true });
const rctx = robotCanvas.getContext("2d");
const bar = document.getElementById("bar");
const statusDiv = document.getElementById("status");

let targetData = null;
let progress = 0;
let isRunning = false;
let animationId = null;
let cloudProgress = 0;
let cloudInterval = null;

function startCloudLoadingBar() {
    cloudProgress = 0;
    bar.style.width = "0%";
    cloudInterval = setInterval(() => {
        if (cloudProgress < 90) { cloudProgress += Math.random() * 8; } 
        else if (cloudProgress < 98) { cloudProgress += 0.4; }
        bar.style.width = Math.min(98, cloudProgress) + "%";
    }, 150);
}

function stopCloudLoadingBar() {
    clearInterval(cloudInterval);
    bar.style.width = "100%";
}

function paint() {
    if (!isRunning) return;

    for(let i=0; i<250; i++) {
        let x = Math.floor(Math.random() * SIZE);
        let y = Math.floor(Math.random() * SIZE);
        let idx = (y * SIZE + x) * 4;

        if (!targetData) continue;

        let r = targetData[idx];
        let g = targetData[idx+1];
        let b = targetData[idx+2];

        r = (r - 128) * 1.2 + 128;
        g = (g - 128) * 1.2 + 128;
        b = (b - 128) * 1.2 + 128;

        r = Math.max(0, Math.min(255, r));
        g = Math.max(0, Math.min(255, g));
        b = Math.max(0, Math.min(255, b));

        rctx.strokeStyle = `rgb(${Math.floor(r)},${Math.floor(g)},${Math.floor(b)})`;
        rctx.lineWidth = 1.5; 
        rctx.globalAlpha = 0.4; 

        rctx.beginPath();
        rctx.moveTo(x, y);
        rctx.lineTo(x + (Math.random()-0.5)*3, y + (Math.random()-0.5)*3);
        rctx.stroke();
    }

    progress += 0.0006; 
    bar.style.width = Math.min(100, progress * 100) + "%";

    if (progress < 1) {
        animationId = requestAnimationFrame(paint);
    } else {
        statusDiv.textContent = "Génération et peinture terminées !";
        isRunning = false;
    }
}

function startCloudGeneration(promptText) {
    isRunning = false;
    cancelAnimationFrame(animationId);
    statusDiv.textContent = "Appel des serveurs d'art IA... (Étape 1/2)";
    startCloudLoadingBar();
    
    const img = new Image();
    // TRÈS IMPORTANT : Permet au canvas de lire l'image sans bloquer le chargement
    img.crossOrigin = "anonymous"; 
    
    let cleanPrompt = promptText.trim()
        .replace(/é|è|ê|ë/g, "e").replace(/à|â/g, "a")
        .replace(/ù|û/g, "u").replace(/ç/g, "c");

    const urlPrompt = encodeURIComponent(cleanPrompt);
    const uniqueSeed = Math.floor(Math.random() * 1000000);
    
    // NOUVEAU MOTEUR : Stable Diffusion par le routeur de secours hautement autorisé pour les sites web
    img.src = `https://no-api-key-image-gen.p.rapidapi.com/image?prompt=${urlPrompt}&size=400x400&seed=${uniqueSeed}`;

    // Si le serveur principal met trop de temps, on bascule automatiquement sur l'alternative directe sécurisée
    const fallbackTimeout = setTimeout(() => {
        if (!img.complete) {
            console.log("Serveur principal ralenti, bascule sur la ligne de secours...");
            img.src = `https://image.pollinations.ai/p/${urlPrompt}?width=400&height=400&nologo=true&seed=${uniqueSeed}&enhance=true`;
        }
    }, 4500);

    img.onload = () => {
        clearTimeout(fallbackTimeout);
        stopCloudLoadingBar();
        setTimeout(() => {
            tctx.clearRect(0,0,SIZE,SIZE);
            tctx.drawImage(img, 0, 0, SIZE, SIZE);
            targetData = tctx.getImageData(0,0,SIZE,SIZE).data;
            rctx.globalAlpha = 1.0;
            rctx.fillStyle = "#ffffff";
            rctx.fillRect(0,0,SIZE,SIZE);
            progress = 0;
            isRunning = true;
            statusDiv.textContent = "Retranscription en direct des pixels... (Étape 2/2)";
            paint();
        }, 300);
    };

    img.onerror = () => {
        clearTimeout(fallbackTimeout);
        clearInterval(cloudInterval);
        bar.style.width = "0%";
        statusDiv.textContent = "❌ Erreur de réseau. Veuillez changer de prompt.";
    };
}

document.getElementById("send").addEventListener("click", () => {
    const val = document.getElementById("cmd").value;
    if (val.trim() !== "") { startCloudGeneration(val); }
    document.getElementById("cmd").value = "";
});

function handleFile(img) {
    isRunning = false; cancelAnimationFrame(animationId);
    tctx.clearRect(0,0,SIZE,SIZE);
    let ratio = Math.max(SIZE / img.width, SIZE / img.height);
    let nw = img.width * ratio; let nh = img.height * ratio;
    tctx.drawImage(img, (SIZE - nw) / 2, (SIZE - nh) / 2, nw, nh);
    targetData = tctx.getImageData(0,0,SIZE,SIZE).data;
    rctx.fillStyle = "#ffffff"; rctx.fillRect(0,0,SIZE,SIZE);
    progress = 0; isRunning = true; paint();
}

document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => handleFile(img);
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
});
</script>
</body>
</html>
