<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio IA v11.0 - Algorithmique Local</title>
    
    <style>
        :root {
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #2563eb;
            --text-main: #0f172a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; 
            background-color: var(--bg-light);
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container { 
            width: 100%;
            max-width: 460px; 
            background: var(--card-bg); 
            padding: 35px; 
            border-radius: 24px; 
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
            text-align: center;
            border: 1px solid var(--border-color);
            margin-top: 20px;
        }

        h1 { font-size: 1.6rem; font-weight: 700; margin: 0 0 8px 0; color: var(--text-main); }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 30px; }
        #target { display: none; }
        
        .canvas-display { 
            margin: 0 auto 25px auto; 
            position: relative;
            display: block;
            width: 100%;
            max-width: 380px;
        }

        canvas#robot { 
            border-radius: 16px; 
            background: #f1f5f9; 
            border: 1px solid var(--border-color);
            width: 100%; 
            height: auto;
            display: block;
        }

        #barContainer { width: 100%; background: #f1f5f9; height: 5px; border-radius: 10px; margin-bottom: 25px; overflow: hidden; }
        #bar { height: 100%; width: 0%; background: var(--accent-color); transition: width 0.2s ease-out; }

        .controls { 
            display: flex; 
            gap: 10px; 
            width: 100%; 
            background: #f8fafc;
            padding: 8px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        input#cmd { 
            flex: 1; 
            padding: 10px 12px; 
            border-radius: 10px; 
            border: none; 
            background: transparent; 
            color: var(--text-main); 
            outline: none;
            font-size: 0.95rem;
        }

        button { 
            padding: 10px 22px; 
            background: var(--text-main); 
            color: #ffffff; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        button:hover { background: #1e293b; }
        .hidden-file { display: none; }
        #status { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 10px; min-height: 1.2em; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h1>Studio Art Génératif</h1>
    <div class="subtitle">Moteur algorithmique local autonome</div>
    
    <div id="status">En attente d'une formule textuelle...</div>
    <div id="barContainer"><div id="bar"></div></div>

    <div class="canvas-display">
        <canvas id="robot" width="400" height="400"></canvas>
        <canvas id="target" width="400" height="400"></canvas>
    </div>

    <div class="controls">
        <input type="file" id="fileInput" class="hidden-file" accept="image/*">
        <button style="background:none; color:var(--text-main); border:1px solid var(--border-color);" onclick="document.getElementById('fileInput').click()">📁</button>
        <input id="cmd" placeholder="Tapez n'importe quel mot...">
        <button id="send">Générer</button>
    </div>
</div>

<script>
const SIZE = 400;
const targetCanvas = document.getElementById("target");
const robotCanvas = document.getElementById("robot");
const tctx = targetCanvas.getContext("2d", { willReadFrequently: true });
const rctx = robotCanvas.getContext("2d");
const bar = document.getElementById("bar");
const statusDiv = document.getElementById("status");

let targetData = null;
let progress = 0;
let isRunning = false;
let animationId = null;

// Fonction mathématique pour transformer un texte en nombre unique (Seed)
function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
    }
    return Math.abs(hash);
}

// Générateur pseudo-aléatoire basé sur la seed du mot
function seededRandom(seed) {
    let x = Math.sin(seed++) * 10000;
    return x - Math.floor(x);
}

function paint() {
    if (!isRunning) return;

    // Vitesse du tracé
    for(let i=0; i<400; i++) {
        let x = Math.floor(Math.random() * SIZE);
        let y = Math.floor(Math.random() * SIZE);
        let idx = (y * SIZE + x) * 4;

        if (!targetData) continue;

        let r = targetData[idx];
        let g = targetData[idx+1];
        let b = targetData[idx+2];

        rctx.strokeStyle = `rgb(${r},${g},${b})`;
        rctx.lineWidth = 1.4; 
        rctx.globalAlpha = 0.35; 

        rctx.beginPath();
        rctx.moveTo(x, y);
        rctx.lineTo(x + (Math.random()-0.5)*4, y + (Math.random()-0.5)*4);
        rctx.stroke();
    }

    progress += 0.0015; 
    bar.style.width = Math.min(100, progress * 100) + "%";

    if (progress < 1) {
        animationId = requestAnimationFrame(paint);
    } else {
        statusDiv.textContent = "Structure géométrique calculée et dessinée !";
        isRunning = false;
    }
}

// NOUVELLE TECHNIQUE : Création de la matrice visuelle directement en local dans le code
function genererMatriceLocale(promptText) {
    isRunning = false;
    cancelAnimationFrame(animationId);
    
    statusDiv.textContent = "Calcul mathématique de la matrice... (Étape 1/2)";
    bar.style.width = "50%";

    let seed = hashString(promptText);
    
    // Nettoyage de la zone cible
    tctx.fillStyle = "#111827"; // Fond sombre de base pour faire ressortir l'art
    tctx.fillRect(0, 0, SIZE, SIZE);

    // Dessin d'une forme d'art fractale/générative unique basée sur les lettres tapées
    const nombreDeFormes = 40 + (seed % 30);
    for (let i = 0; i < nombreDeFormes; i++) {
        let r1 = seededRandom(seed + i * 1);
        let r2 = seededRandom(seed + i * 2);
        let r3 = seededRandom(seed + i * 3);
        let r4 = seededRandom(seed + i * 4);

        let cx = r1 * SIZE;
        let cy = r2 * SIZE;
        let rayon = 20 + (r3 * 100);

        // Choix de couleurs dynamiques et harmonieuses basées sur le texte
        let red = Math.floor(r1 * 255);
        let green = Math.floor(r4 * 255);
        let blue = Math.floor((r2 + r3) * 127);

        tctx.strokeStyle = `rgba(${red}, ${green}, ${blue}, 0.6)`;
        tctx.lineWidth = 2 + (r2 * 6);

        tctx.beginPath();
        if (i % 2 === 0) {
            // Cercles concentriques
            tctx.arc(cx, cy, rayon, 0, Math.PI * 2);
        } else {
            // Rectangles et lignes entrelacées
            tctx.strokeRect(cx - rayon/2, cy - rayon/2, rayon, rayon);
            tctx.moveTo(cx, 0);
            tctx.lineTo(cx, SIZE);
        }
        tctx.stroke();
    }

    // Lancement immédiat du processus de peinture
    setTimeout(() => {
        bar.style.width = "100%";
        targetData = tctx.getImageData(0, 0, SIZE, SIZE).data;
        
        // Reset du canvas visible
        rctx.globalAlpha = 1.0;
        rctx.fillStyle = "#ffffff";
        rctx.fillRect(0, 0, SIZE, SIZE);
        
        progress = 0;
        isRunning = true;
        statusDiv.textContent = "Retranscription en cours... (Étape 2/2)";
        paint();
    }, 200);
}

document.getElementById("send").addEventListener("click", () => {
    const val = document.getElementById("cmd").value;
    if (val.trim() !== "") { genererMatriceLocale(val); }
    document.getElementById("cmd").value = "";
});

function handleFile(img) {
    isRunning = false; 
    cancelAnimationFrame(animationId);
    tctx.clearRect(0, 0, SIZE, SIZE);
    let ratio = Math.max(SIZE / img.width, SIZE / img.height);
    let nw = img.width * ratio; 
    let nh = img.height * ratio;
    tctx.drawImage(img, (SIZE - nw) / 2, (SIZE - nh) / 2, nw, nh);
    targetData = tctx.getImageData(0, 0, SIZE, SIZE).data;
    rctx.fillStyle = "#ffffff"; 
    rctx.fillRect(0, 0, SIZE, SIZE);
    progress = 0; 
    isRunning = true; 
    paint();
}

document.getElementById("fileInput").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => handleFile(img);
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }
});
</script>
</body>
</html>
