<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA — Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0b;
    --surface: #111113;
    --surface2: #1a1a1d;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --text: #e8e6e0;
    --muted: #666560;
    --accent: #c8f060;
    --accent-dim: rgba(200, 240, 96, 0.12);
    --user-bg: #1e2a10;
    --user-border: rgba(200, 240, 96, 0.2);
    --font-display: 'Syne', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.7;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .logo {
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--accent);
    text-transform: uppercase;
  }

  .status {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2.5s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 14px;
    max-width: 820px;
    animation: fadeUp 0.25s ease forwards;
    opacity: 0;
    transform: translateY(8px);
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user { flex-direction: row-reverse; align-self: flex-end; }

  .avatar {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-family: var(--font-display);
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-top: 2px;
  }

  .msg.assistant .avatar {
    background: var(--accent-dim);
    color: var(--accent);
    border: 1px solid rgba(200, 240, 96, 0.2);
  }

  .msg.user .avatar {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border2);
  }

  .bubble {
    padding: 12px 16px;
    border-radius: 10px;
    line-height: 1.75;
    font-size: 13.5px;
    max-width: 680px;
  }

  .msg.assistant .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 2px 10px 10px 10px;
  }

  .msg.user .bubble {
    background: var(--user-bg);
    border: 1px solid var(--user-border);
    color: #d4e8a0;
    border-radius: 10px 2px 10px 10px;
  }

  .bubble p { margin-bottom: 0.5em; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble code {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border2);
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 12px;
  }
  .bubble pre {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border2);
    padding: 12px;
    border-radius: 6px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .bubble pre code { background: none; border: none; padding: 0; }
  .bubble strong { color: var(--accent); font-weight: 500; }
  .bubble ul, .bubble ol { padding-left: 18px; }
  .bubble li { margin-bottom: 2px; }

  .typing-indicator {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 2px 10px 10px 10px;
    width: fit-content;
  }

  .typing-indicator span {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite;
  }
  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  .input-area {
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--surface2);
    border: 1px solid var(--border2);
    border-radius: 10px;
    padding: 10px 12px;
    transition: border-color 0.2s;
  }

  .input-row:focus-within {
    border-color: rgba(200, 240, 96, 0.35);
  }

  #input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13.5px;
    line-height: 1.6;
    resize: none;
    max-height: 160px;
    overflow-y: auto;
  }

  #input::placeholder { color: var(--muted); }

  #input::-webkit-scrollbar { width: 3px; }
  #input::-webkit-scrollbar-thumb { background: var(--border2); }

  #send {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: var(--accent);
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.15s, transform 0.1s;
    color: #0a0a0b;
  }

  #send:hover { opacity: 0.85; }
  #send:active { transform: scale(0.93); }
  #send:disabled { opacity: 0.25; cursor: default; }

  #send svg { width: 14px; height: 14px; }

  .hint {
    text-align: center;
    font-size: 10.5px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.04em;
  }

  .welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 10px;
    padding: 40px 20px;
    text-align: center;
  }

  .welcome-icon {
    width: 48px; height: 48px;
    border-radius: 12px;
    background: var(--accent-dim);
    border: 1px solid rgba(200,240,96,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    margin-bottom: 6px;
  }

  .welcome h1 {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--text);
  }

  .welcome p {
    color: var(--muted);
    font-size: 13px;
    max-width: 340px;
  }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 16px;
  }

  .sug-btn {
    background: var(--surface2);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 7px 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }

  .sug-btn:hover {
    border-color: rgba(200,240,96,0.3);
    background: var(--accent-dim);
    color: var(--accent);
  }

  .error-bubble {
    background: rgba(180, 40, 40, 0.12);
    border: 1px solid rgba(180, 40, 40, 0.25);
    color: #f09090;
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>

<header>
  <span class="logo">◈ Neural</span>
  <div class="status">
    <div class="dot"></div>
    <span>claude-sonnet-4</span>
  </div>
</header>

<div class="messages" id="messages">
  <div class="welcome" id="welcome">
    <div class="welcome-icon">◈</div>
    <h1>Bonjour.</h1>
    <p>Pose-moi n'importe quelle question — je suis là pour répondre.</p>
    <div class="suggestions">
      <button class="sug-btn" onclick="suggest(this)">C'est quoi la relativité ?</button>
      <button class="sug-btn" onclick="suggest(this)">Écris un poème sur la nuit</button>
      <button class="sug-btn" onclick="suggest(this)">Explique-moi l'IA</button>
      <button class="sug-btn" onclick="suggest(this)">Résous : ∫x²dx</button>
    </div>
  </div>
</div>

<div class="input-area">
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Écris ton message..." autocomplete="off"></textarea>
    <button id="send" onclick="sendMessage()" title="Envoyer">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8h12M8 2l6 6-6 6"/>
      </svg>
    </button>
  </div>
  <div class="hint">Entrée pour envoyer · Shift+Entrée pour nouvelle ligne</div>
</div>

<script>
const history = [];
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

function suggest(btn) {
  inputEl.value = btn.textContent;
  inputEl.dispatchEvent(new Event('input'));
  sendMessage();
}

function escapeHTML(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatText(text) {
  let html = escapeHTML(text);
  html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) =>
    `<pre><code>${code.trim()}</code></pre>`
  );
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
  const lines = html.split('\n');
  const out = [];
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (trimmed.match(/^[-•]\s/)) {
      if (!inList) { out.push('<ul>'); inList = true; }
      out.push(`<li>${trimmed.slice(2)}</li>`);
    } else {
      if (inList) { out.push('</ul>'); inList = false; }
      if (trimmed) out.push(`<p>${line}</p>`);
    }
  }
  if (inList) out.push('</ul>');
  return out.join('');
}

function addMessage(role, content) {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const wrap = document.createElement('div');
  wrap.className = `msg ${role}`;
  wrap.innerHTML = `
    <div class="avatar">${role === 'assistant' ? '◈' : 'Toi'}</div>
    <div class="bubble">${role === 'user' ? `<p>${escapeHTML(content)}</p>` : formatText(content)}</div>
  `;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrap;
}

function showTyping() {
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typing';
  wrap.innerHTML = `
    <div class="avatar">◈</div>
    <div class="typing-indicator"><span></span><span></span><span></span></div>
  `;
  messagesEl.appendChild(wrap);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', text);
  history.push({ role: 'user', content: text });

  showTyping();

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: 'Tu es une IA brillante et concise. Tu réponds en français par défaut, sauf si l\'utilisateur écrit dans une autre langue. Tes réponses sont claires, précises et élégantes.',
        messages: history
      })
    });

    const data = await res.json();

    const typing = document.getElementById('typing');
    if (typing) typing.remove();

    if (data.error) {
      const errWrap = document.createElement('div');
      errWrap.className = 'msg assistant';
      errWrap.innerHTML = `<div class="avatar">◈</div><div class="error-bubble">Erreur : ${escapeHTML(data.error.message)}</div>`;
      messagesEl.appendChild(errWrap);
    } else {
      const reply = data.content.map(b => b.type === 'text' ? b.text : '').join('');
      history.push({ role: 'assistant', content: reply });
      addMessage('assistant', reply);
    }
  } catch (err) {
    const typing = document.getElementById('typing');
    if (typing) typing.remove();

    const errWrap = document.createElement('div');
    errWrap.className = 'msg assistant';
    errWrap.innerHTML = `<div class="avatar">◈</div><div class="error-bubble">Impossible de contacter l'API. Vérifie ta connexion.</div>`;
    messagesEl.appendChild(errWrap);
  }

  sendBtn.disabled = false;
  inputEl.focus();
  messagesEl.scrollTop = messagesEl.scrollHeight;
}
</script>
</body>
</html>
