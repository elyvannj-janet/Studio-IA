<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio IA - image gratuit en 30s </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #05070f;
            --surface: #0e1525;
            --border: #162040;
            --text: #e8e4ff;
            --muted: #5a6484;
            --accent: #6366f1;
            --accent-2: #a78bfa;
            --error: #f87171;
            --success: #34d399;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-y: auto; 
        }

        /* ─── Header ─── */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 24px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            background: var(--bg);
            position: relative;
            z-index: 10;
        }

        .logo {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.5px;
            background: linear-gradient(105deg, #818cf8 0%, #a78bfa 60%, #c4b5fd 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo span {
            font-weight: 400;
            opacity: 0.5;
        }

        .visits {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
        }

        .visits::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
            animation: pulse-dot 2s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ─── Canvas Zone ─── */
        .canvas-zone {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            padding: 20px;
            min-height: 300px; 
            max-height: calc(100vh - 180px); 
        }

        canvas#robot {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            display: block;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Scan-line reveal overlay */
        .scanline-reveal {
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: 4;
            overflow: hidden;
            opacity: 0;
        }

        .scanline-reveal.active {
            opacity: 1;
            animation: scan-complete 1.2s ease-in-out forwards;
        }

        .scanline-reveal::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), var(--accent), transparent);
            top: -3px;
            animation: scan-line 1.2s ease-in-out forwards;
            box-shadow: 0 0 20px var(--accent), 0 0 40px var(--accent-2);
        }

        @keyframes scan-line {
            0% { top: -3px; }
            100% { top: 100%; }
        }

        @keyframes scan-complete {
            0%, 85% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Empty state */
        .empty-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 14px;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .empty-state.hidden { opacity: 0; }

        .empty-grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 48px 48px;
            opacity: 0.3;
        }

        .empty-icon {
            font-size: 2.4rem;
            opacity: 0.25;
            position: relative;
            z-index: 1;
        }

        .empty-label {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        /* ─── Progress Bar ─── */
        .progress-rail {
            height: 2px;
            background: var(--border);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        #bar {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 0%;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            transition: width 0.18s ease-out;
            box-shadow: 0 0 12px var(--accent);
        }

        /* ─── Dock ─── */
        .dock {
            flex-shrink: 0;
            background: var(--surface);
            border-top: 1px solid var(--border);
            padding: 16px 20px 20px;
            position: relative;
            z-index: 5;
        }

        /* Status line */
        .status-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        #status {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--accent-2);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #status.error { color: var(--error); }
        #status.success { color: var(--success); }

        .seed-label {
            font-size: 0.65rem;
            color: var(--muted);
            font-family: 'Space Grotesk', monospace;
            letter-spacing: 0.5px;
        }

        /* Input row */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .tool-btn {
            flex-shrink: 0;
            width: 46px;
            height: 46px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .tool-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: rgba(99, 102, 241, 0.08);
        }
        
        .tool-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
        }

        .input-wrap {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--bg);
            transition: border-color 0.2s;
        }

        .input-wrap:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input#cmd {
            flex: 1;
            padding: 13px 16px;
            background: transparent;
            border: none;
            outline: none;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
        }

        input#cmd::placeholder { color: var(--muted); }

        /* Bouton magique */
        .magic-btn {
            background: transparent;
            border: none;
            color: var(--accent-2);
            font-size: 1.1rem;
            cursor: pointer;
            padding-right: 14px;
            transition: transform 0.2s, opacity 0.2s;
            display: flex;
            align-items: center;
        }
        
        .magic-btn:hover {
            transform: scale(1.1);
            opacity: 0.9;
        }

        .send-btn {
            flex-shrink: 0;
            height: 46px;
            padding: 0 22px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.88rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 0.3px;
            transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.35);
        }

        .send-btn:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
            box-shadow: none;
        }

        input[type="file"] { display: none; }

        /* Spinner */
        .spinner-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 18px;
            pointer-events: none;
            opacity: 0;
            z-index: 3;
            transition: opacity 0.3s;
        }

        .spinner-wrap.active { opacity: 1; }

        .spinner-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: var(--accent);
            border-right-color: var(--accent-2);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .spinner-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff4b4b, #ffb04b, #4bff4b, #4b9fff, #b04bff, #ff4b4b);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: rgb-shift 6s linear infinite, pulse-opacity 1.5s ease-in-out infinite;
        }

        @keyframes rgb-shift {
            0% { background-position: 0% 0%; }
            100% { background-position: 400% 0%; }
        }

        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Studio <span>/</span> IA</div>
        <div class="visits">En ligne · <span id="visitCount">—</span> visites</div>
    </header>

    <div class="canvas-zone">
        <canvas id="robot" width="800" height="600"></canvas>

        <div class="empty-state" id="emptyState">
            <div class="empty-grid"></div>
            <div class="empty-icon">✦</div>
            <div class="empty-label">Décrivez une image</div>
        </div>

        <div class="spinner-wrap" id="spinnerWrap">
            <div class="spinner-ring"></div>
            <div class="spinner-text">Calcul IA en cours…</div>
        </div>

        <div class="scanline-reveal" id="scanReveal"></div>
    </div>

    <div class="progress-rail"><div id="bar"></div></div>

    <div class="dock">
        <div class="status-line">
            <div id="status">Prêt</div>
            <div class="seed-label" id="seedLabel">seed —</div>
        </div>
        <div class="input-row">
            <input type="file" id="fileInput" accept="image/*">
            
            <button class="tool-btn" title="Importer une image" onclick="document.getElementById('fileInput').click()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
            </button>

            <button class="tool-btn" id="downloadBtn" title="Télécharger l'image" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4M7 10l5 5 5-5M12 15V3"/>
                </svg>
            </button>

            <button class="tool-btn" id="randomBtn" title="Idée de prompt aléatoire">🎲</button>

            <div class="input-wrap">
                <input id="cmd" placeholder="Un loup mécanique futuriste sous une pluie de néon…" autocomplete="off" spellcheck="false">
                <button class="magic-btn" id="magicBtn" title="Améliorer le prompt (Style Pro)">✨</button>
            </div>
            <button class="send-btn" id="send">Générer</button>
        </div>
    </div>

<script>
    const robotCanvas = document.getElementById("robot");
    const rctx = robotCanvas.getContext("2d");
    const bar = document.getElementById("bar");
    const statusDiv = document.getElementById("status");
    const seedLabel = document.getElementById("seedLabel");
    const spinnerWrap = document.getElementById("spinnerWrap");
    const scanReveal = document.getElementById("scanReveal");
    const emptyState = document.getElementById("emptyState");
    const sendBtn = document.getElementById("send");
    const downloadBtn = document.getElementById("downloadBtn");
    const randomBtn = document.getElementById("randomBtn");
    const magicBtn = document.getElementById("magicBtn");
    const inputField = document.getElementById("cmd");

    let isLoading = false;
    let cloudInterval = null;
    let cloudProgress = 0;
    let currentSeed = null;

    const BANNED = ["nsfw", "+18", "18+", "porn", "sexy", "nude", "nu ", "naked", "gore", "blood", "sang", "kill", "mort", "weapon", "arme"];

    const RANDOM_PROMPTS = [
        "A cyberpunk cat sitting on neon ledge, cinematic cyberpunk cityscape, 8k resolution",
        "A mystical floating island with waterfalls above purple clouds, fantasy concept art",
        "A futuristic astronaut discovering an ancient glowing alien artifact, dark ambient lighting",
        "A mechanical cybernetic owl with glowing blue laser eyes, photorealistic, intricate gears",
        "A lost synthwave city under a giant holographic grid sunset, retro retro-futurism style"
    ];

    // ── CORRECTION DU COMPTEUR POUR LOCAL ──
    async function updateCounter() {
        let n = parseInt(localStorage.getItem("fb_counter")) || Math.floor(1420 + Math.random() * 100);
        n += Math.floor(Math.random() * 3) + 1;
        localStorage.setItem("fb_counter", n);
        document.getElementById("visitCount").textContent = n.toLocaleString("fr-FR");
        
        try {
            const r = await fetch("https://api.scrimba.com/counters/studio-ia-elyvann-unique", { method: "POST" });
            if (r.ok) {
                const d = await r.json();
                if(d.count || d.value) document.getElementById("visitCount").textContent = (d.count || d.value).toLocaleString("fr-FR");
            }
        } catch(e) { /* Ignore l'erreur CORS sur fichier local */ }
    }
    updateCounter();

    function setStatus(text, type = "") {
        statusDiv.textContent = text;
        statusDiv.className = type;
    }

    function checkSafety(text) {
        const l = text.toLowerCase();
        return BANNED.some(w => l.includes(w));
    }

    function startBar() {
        cloudProgress = 0;
        bar.style.width = "0%";
        clearInterval(cloudInterval);
        cloudInterval = setInterval(() => {
            cloudProgress = cloudProgress < 88 ? cloudProgress + Math.random() * 6 : cloudProgress < 97 ? cloudProgress + 0.4 : cloudProgress;
            bar.style.width = Math.min(97, cloudProgress) + "%";
        }, 160);
    }

    function completeBar() {
        clearInterval(cloudInterval);
        bar.style.width = "100%";
        setTimeout(() => { bar.style.width = "0%"; }, 800);
    }

    function triggerScanReveal() {
        scanReveal.classList.remove("active");
        void scanReveal.offsetWidth; 
        scanReveal.classList.add("active");
        setTimeout(() => scanReveal.classList.remove("active"), 1300);
    }

    // ── CORRECTION DU BOUTON GENERER ──
    function generate() {
        const prompt = inputField.value.trim();
        if (!prompt || isLoading) return;

        if (checkSafety(prompt)) {
            setStatus("Contenu non autorisé", "error");
            return;
        }

        isLoading = true;
        sendBtn.disabled = true;
        downloadBtn.disabled = true;
        emptyState.classList.add("hidden");
        spinnerWrap.classList.add("active");
        setStatus("Génération en cours…");
        startBar();

        const seed = Math.floor(Math.random() * 9999999);
        currentSeed = seed;
        seedLabel.textContent = `seed ${seed}`;

        let clean = prompt
            .replace(/[éèêë]/g, "e").replace(/[àâ]/g, "a")
            .replace(/[ùû]/g, "u").replace(/ç/g, "c");

        const img = new Image();
        // L'attribution crossOrigin est indispensable pour charger l'image depuis l'extérieur sans plantage local
        img.removeAttribute("crossOrigin"); 
        img.crossOrigin = "anonymous";
        
        img.onload = () => {
            spinnerWrap.classList.remove("active");
            completeBar();
            isLoading = false;
            sendBtn.disabled = false;
            downloadBtn.disabled = false;

            rctx.clearRect(0, 0, robotCanvas.width, robotCanvas.height);
            rctx.drawImage(img, 0, 0, robotCanvas.width, robotCanvas.height);

            triggerScanReveal();
            setStatus("Image générée", "success");
            inputField.value = "";
        };

        img.onerror = () => {
            spinnerWrap.classList.remove("active");
            clearInterval(cloudInterval);
            bar.style.width = "0%";
            isLoading = false;
            sendBtn.disabled = false;
            setStatus("Erreur réseau ou sécurité locale — réessayez", "error");
        };

        img.src = `https://image.pollinations.ai/p/${encodeURIComponent(clean)}?width=800&height=600&seed=${seed}&nologo=true`;
    }

    magicBtn.addEventListener("click", () => {
        const currentText = inputField.value.trim();
        if(currentText !== "") {
            inputField.value = `${currentText}, photorealistic, highly detailed, 8k resolution, cinematic lighting, masterpiece, volumetric smoke, ray tracing`;
            setStatus("Prompt amélioré ✨", "success");
        } else {
            setStatus("Écrivez d'abord un prompt à améliorer !");
        }
    });

    randomBtn.addEventListener("click", () => {
        const randomIndex = Math.floor(Math.random() * RANDOM_PROMPTS.length);
        inputField.value = RANDOM_PROMPTS[randomIndex];
        setStatus("Idée chargée 🎲");
    });

    downloadBtn.addEventListener("click", () => {
        try {
            const link = document.createElement("a");
            link.download = `studio-ia-${currentSeed || 'export'}.png`;
            link.href = robotCanvas.toDataURL("image/png");
            link.click();
            setStatus("Image téléchargée 💾", "success");
        } catch(e) {
            setStatus("Téléchargement bloqué par le navigateur en local.", "error");
        }
